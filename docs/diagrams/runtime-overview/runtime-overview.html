<template id="detail-mcp" data-title="RemoteMCPTool"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Call tools provided by the SREGym tool servers.</p><dl><dt>Input</dt><dd><ul><li>Selected remote tool name and JSON arguments.</li><li>Replies from the configured tool server.</li></ul></dd><dt>Output</dt><dd><ul><li>MCP requests to the Prometheus or Jaeger tool server.</li><li>Structured tool results containing returned content or errors.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Discover tool definitions through MCP (Model Context Protocol).</li><li>Send the selected name and arguments to the configured server over its SSE connection.</li><li>Serialize calls to the same server through a shared client lock.</li><li>Extract and combine returned content into a HolmesGPT tool result.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/mcp/toolset_mcp.py#L982-L993" target="_blank" rel="noopener noreferrer">RemoteMCPToolset._load_remote_tools</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/mcp/toolset_mcp.py:L982-L993</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/mcp/toolset_mcp.py#L685-L700" target="_blank" rel="noopener noreferrer">RemoteMCPTool.create</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/mcp/toolset_mcp.py:L685-L700</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/mcp/toolset_mcp.py#L1355-L1357" target="_blank" rel="noopener noreferrer">RemoteMCPToolset._get_server_tools</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/mcp/toolset_mcp.py:L1355-L1357</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/mcp/toolset_mcp.py#L431-L459" target="_blank" rel="noopener noreferrer">RemoteMCPTool._invoke</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/mcp/toolset_mcp.py:L431-L459</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/mcp/toolset_mcp.py#L613-L683" target="_blank" rel="noopener noreferrer">RemoteMCPTool._invoke_async</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/mcp/toolset_mcp.py:L613-L683</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/mcp/toolset_mcp.py#L273-L337" target="_blank" rel="noopener noreferrer">get_initialized_mcp_session</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/mcp/toolset_mcp.py:L273-L337</small></li></ul></div></template>
<template id="detail-filter" data-title="KubernetesAPIProxy"><div class="detail-body"><p class="owner">SREGYM</p><p>Forward allowed requests to the Kubernetes API.</p><dl><dt>Input</dt><dd><ul><li>kubectl requests using the agent’s configured Kubernetes credentials.</li><li>Kubernetes API replies.</li></ul></dd><dt>Output</dt><dd><ul><li>Allowed API requests.</li><li>Filtered API replies or access errors.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Apply SREGym access rules to requests and returned resources.</li><li>Hide benchmark internals and selected sensitive resources.</li><li>Forward permitted requests and return access errors for blocked requests. Filtered mode blocks Kubernetes service-proxy requests, including target lookup.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/k8s_proxy.py#L443-L494" target="_blank" rel="noopener noreferrer">KubernetesAPIProxy: access policy configuration</a><small class="source-path">SREGym: sregym/service/k8s_proxy.py:L443-L494</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/k8s_proxy.py#L629-L1049" target="_blank" rel="noopener noreferrer">FilteringProxyHandler: validate, forward and filter API requests</a><small class="source-path">SREGym: sregym/service/k8s_proxy.py:L629-L1049</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/k8s_proxy.py#L1103-L1167" target="_blank" rel="noopener noreferrer">KubernetesAPIProxy.generate_agent_kubeconfig</a><small class="source-path">SREGym: sregym/service/k8s_proxy.py:L1103-L1167</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/agent_visibility_policy.py#L27-L161" target="_blank" rel="noopener noreferrer">Resource visibility and response filtering</a><small class="source-path">SREGym: sregym/service/agent_visibility_policy.py:L27-L161</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/container_runner.py#L446-L568" target="_blank" rel="noopener noreferrer">Agent credentials and filtered network access</a><small class="source-path">SREGym: sregym/service/container_runner.py:L446-L568</small></li></ul></div></template>
<template id="detail-endpoints" data-title="HTTP / TCP endpoints"><div class="detail-body"><p class="owner">MODEL / CLUSTER BACKEND</p><p>Receive web requests and TCP connection checks.</p><dl><dt>Input</dt><dd><ul><li>HTTP GET requests from fetch_webpage.</li><li>Socket connection attempts from tcp_check.</li></ul></dd><dt>Output</dt><dd><ul><li>HTTP content, redirects or failures.</li><li>TCP connection acceptance, refusal or timeout.</li></ul></dd><dt>Behavior</dt><dd><ul><li>SREGym’s filtered network allows only the selected model provider and local SREGym services through an HTTP proxy. Arbitrary websites and direct outbound TCP probes are blocked.</li><li>The SDK also checks destinations. With the configured defaults, private/internal targets require explicit permission.</li><li>When access is permitted, FetchWebpage processes the HTTP response in the agent. TcpCheckTool reports the socket connection outcome.</li></ul></dd></dl><h3>Related Sources</h3><p class="source-note">Caller code for these backend requests.</p><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/internet/internet.py#L102-L193" target="_blank" rel="noopener noreferrer">scrape</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/internet/internet.py:L102-L193</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/connectivity_check.py#L109-L125" target="_blank" rel="noopener noreferrer">tcp_check</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/connectivity_check.py:L109-L125</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/container_runner.py#L313-L334" target="_blank" rel="noopener noreferrer">Allowed local services and provider endpoints</a><small class="source-path">SREGym: sregym/service/container_runner.py:L313-L334</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/docker_egress.py#L85-L114" target="_blank" rel="noopener noreferrer">Isolated agent network and HTTP proxy settings</a><small class="source-path">SREGym: sregym/service/docker_egress.py:L85-L114</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/docker_egress.py#L194-L201" target="_blank" rel="noopener noreferrer">Create the internal Docker network</a><small class="source-path">SREGym: sregym/service/docker_egress.py:L194-L201</small></li><li><a href="../../../runtime/campaign.py" target="_blank" rel="noopener noreferrer">Filtered campaign settings</a><small class="source-path">parent: runtime/campaign.py</small></li></ul></div></template>
<template id="detail-prom_handler" data-title="Prometheus MCP server"><div class="detail-body"><p class="owner">SREGYM</p><p>Query metrics and firing alerts.</p><dl><dt>Input</dt><dd><ul><li>get_metrics: a metric query written in PromQL (Prometheus Query Language).</li><li>get_alerts: no arguments.</li></ul></dd><dt>Output</dt><dd><ul><li>HTTP GET /api/v1/query with the supplied expression, or GET /api/v1/alerts.</li><li>Filtered metric or alert data as MCP text, or an error message.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Build the HTTP request with the supplied tool arguments.</li><li>Send it through the shared HTTP client, which retries selected HTTP failures.</li><li>Parse the JSON reply and filter records using SREGym visibility rules. Keep only firing alerts for get_alerts.</li><li>Return text through MCP. Prometheus evaluates the query expression.</li></ul></dd></dl><h3>Tool definitions</h3><details class="tool-definition"><summary>get_metrics</summary><dl class="tool-info"><dt>Toolset</dt><dd>sregym_prometheus</dd><dt>Execution</dt><dd>RemoteMCPTool → SREGym Python handler → Prometheus GET /api/v1/query; Prometheus evaluates PromQL</dd><dt>Returns</dt><dd>Visibility-filtered metric data as text</dd></dl><p><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/prometheus_server.py#L16-L46" target="_blank" rel="noopener noreferrer">get_metrics</a><small class="source-path">SREGym: mcp_server/prometheus_server.py:L16-L46</small></p><pre><code>@mcp.tool(name=&quot;get_metrics&quot;)
def get_metrics(query: str) -&gt; str:
    &quot;&quot;&quot;Query real-time metrics data from the Prometheus instance.

    Args:
        query (str): A Prometheus Query Language (PromQL) expression used to fetch metric values.

    Returns:
        str: String of metric results, including timestamps, values, and labels or error information.
    &quot;&quot;&quot;

    logger.info(&quot;[prom_mcp] get_metrics called, getting prometheus metrics&quot;)

    observability_client = ObservabilityClient(PROMETHEUS_URL)
    try:
        url = f&quot;{PROMETHEUS_URL}/api/v1/query&quot;
        param = {&quot;query&quot;: query}
        response = observability_client.make_request(&quot;GET&quot;, url, params=param)
        logger.info(f&quot;[prom_mcp] get_metrics status code: {response.status_code}&quot;)
        logger.info(f&quot;[prom_mcp] get_metrics result: {response}&quot;)
        data = response.json()[&quot;data&quot;]
        if isinstance(data.get(&quot;result&quot;), list):
            data[&quot;result&quot;] = [record for record in data[&quot;result&quot;] if visible_observability_record(record)]
        metrics = str(data)
        result = metrics if metrics else &quot;None&quot;

        return result
    except Exception as e:
        err_str = f&quot;[prom_mcp] Error querying get_metrics: {str(e)}&quot;
        logger.error(err_str)
        return err_str</code></pre></details><details class="tool-definition"><summary>get_alerts</summary><dl class="tool-info"><dt>Toolset</dt><dd>sregym_prometheus</dd><dt>Execution</dt><dd>RemoteMCPTool → SREGym Python handler → Prometheus GET /api/v1/alerts</dd><dt>Returns</dt><dd>Visible firing alerts as text</dd></dl><p><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/prometheus_server.py#L49-L79" target="_blank" rel="noopener noreferrer">get_alerts</a><small class="source-path">SREGym: mcp_server/prometheus_server.py:L49-L79</small></p><pre><code>@mcp.tool(name=&quot;get_alerts&quot;)
def get_alerts() -&gt; str:
    &quot;&quot;&quot;Get all currently firing alerts from the Prometheus instance.

    Returns a list of firing alerts with their labels (alertname, severity,
    namespace, service_name, etc.) and annotations (summary, description).

    Returns:
        str: String of firing alert data including alert names, labels,
             and annotations, or &quot;No firing alerts&quot; if none are active.
    &quot;&quot;&quot;

    logger.info(&quot;[prom_mcp] get_alerts called&quot;)

    observability_client = ObservabilityClient(PROMETHEUS_URL)
    try:
        url = f&quot;{PROMETHEUS_URL}/api/v1/alerts&quot;
        response = observability_client.make_request(&quot;GET&quot;, url)
        logger.info(f&quot;[prom_mcp] get_alerts status code: {response.status_code}&quot;)

        alerts = response.json().get(&quot;data&quot;, {}).get(&quot;alerts&quot;, [])
        firing = [a for a in alerts if a.get(&quot;state&quot;) == &quot;firing&quot; and visible_observability_record(a)]

        if not firing:
            return &quot;No firing alerts&quot;

        return str(firing)
    except Exception as e:
        err_str = f&quot;[prom_mcp] Error querying get_alerts: {str(e)}&quot;
        logger.error(err_str)
        return err_str</code></pre></details><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/prometheus_server.py#L16-L46" target="_blank" rel="noopener noreferrer">get_metrics</a><small class="source-path">SREGym: mcp_server/prometheus_server.py:L16-L46</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/prometheus_server.py#L49-L79" target="_blank" rel="noopener noreferrer">get_alerts</a><small class="source-path">SREGym: mcp_server/prometheus_server.py:L49-L79</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/utils.py#L48-L59" target="_blank" rel="noopener noreferrer">ObservabilityClient.create_retrying_session</a><small class="source-path">SREGym: mcp_server/utils.py:L48-L59</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/utils.py#L61-L71" target="_blank" rel="noopener noreferrer">ObservabilityClient.make_request</a><small class="source-path">SREGym: mcp_server/utils.py:L61-L71</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/agent_visibility_policy.py#L168-L178" target="_blank" rel="noopener noreferrer">visible_observability_record</a><small class="source-path">SREGym: sregym/service/agent_visibility_policy.py:L168-L178</small></li></ul></div></template>
<template id="detail-jaeger_handler" data-title="Jaeger MCP server"><div class="detail-body"><p class="owner">SREGYM</p><p>Search application traces.</p><dl><dt>Input</dt><dd><ul><li>get_operations: service name. get_services: no arguments.</li><li>get_traces: service name and lookback in minutes.</li><li>get_dependency_graph: lookback in minutes.</li></ul></dd><dt>Output</dt><dd><ul><li>HTTP GET requests to /api/services, /api/operations, /api/traces or /api/dependencies.</li><li>Service names, operations, traces or dependencies as MCP text. Errors can return as text or a failed tool call.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Convert service and time arguments into HTTP query parameters.</li><li>Request Jaeger data through the shared HTTP client.</li><li>Convert returned JSON to text for the MCP reply.</li></ul></dd></dl><h3>Tool definitions</h3><details class="tool-definition"><summary>get_services</summary><dl class="tool-info"><dt>Toolset</dt><dd>sregym_jaeger</dd><dt>Execution</dt><dd>RemoteMCPTool → SREGym Python handler → Jaeger GET /api/services</dd><dt>Returns</dt><dd>Application service names as text</dd></dl><p><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L13-L38" target="_blank" rel="noopener noreferrer">get_services</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L13-L38</small></p><pre><code>@mcp.tool(name=&quot;get_services&quot;)
def get_services() -&gt; str:
    &quot;&quot;&quot;Retrieve the list of service names from the Grafana instance.

    Returns:
        str: String of a list of service names available in Grafana or error information.
    &quot;&quot;&quot;

    logger.debug(&quot;[ob_mcp] get_services called, getting jaeger services&quot;)

    jaeger_url = &quot;http://jaeger-out.observe.svc.cluster.local:16686&quot;
    jaeger_client = ObservabilityClient(jaeger_url)
    try:
        url = f&quot;{jaeger_url}/api/services&quot;
        response = jaeger_client.make_request(&quot;GET&quot;, url)
        logger.debug(f&quot;[ob_mcp] get_services status code: {response.status_code}&quot;)
        logger.debug(f&quot;[ob_mcp] get_services result: {response}&quot;)
        logger.debug(f&quot;[ob_mcp] result: {response.json()}&quot;)
        services = str(response.json()[&quot;data&quot;])
        result = services if services else &quot;None&quot;

        return result
    except Exception as e:
        err_str = f&quot;[ob_mcp] Error querying get_services: {str(e)}&quot;
        logger.error(err_str)
        return err_str</code></pre></details><details class="tool-definition"><summary>get_operations</summary><dl class="tool-info"><dt>Toolset</dt><dd>sregym_jaeger</dd><dt>Execution</dt><dd>RemoteMCPTool → SREGym Python handler → Jaeger GET /api/operations with a service name</dd><dt>Returns</dt><dd>Operation names as text</dd></dl><p><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L41-L68" target="_blank" rel="noopener noreferrer">get_operations</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L41-L68</small></p><pre><code>@mcp.tool(name=&quot;get_operations&quot;)
def get_operations(service: str) -&gt; str:
    &quot;&quot;&quot;Query available operations for a specific service from the Grafana instance.

    Args:
        service (str): The name of the service whose operations should be retrieved.

    Returns:
        str: String of a list of operation names associated with the specified service or error information.
    &quot;&quot;&quot;

    logger.debug(&quot;[ob_mcp] get_operations called, getting jaeger operations&quot;)

    jaeger_url = &quot;http://jaeger-out.observe.svc.cluster.local:16686&quot;
    jaeger_client = ObservabilityClient(jaeger_url)
    try:
        url = f&quot;{jaeger_url}/api/operations&quot;
        params = {&quot;service&quot;: service}
        response = jaeger_client.make_request(&quot;GET&quot;, url, params=params)
        logger.debug(f&quot;[ob_mcp] get_operations: {response.status_code}&quot;)
        operations = str(response.json()[&quot;data&quot;])
        result = operations if operations else &quot;None&quot;

        return result
    except Exception as e:
        err_str = f&quot;[ob_mcp] Error querying get_operations: {str(e)}&quot;
        logger.error(err_str)
        return err_str</code></pre></details><details class="tool-definition"><summary>get_traces</summary><dl class="tool-info"><dt>Toolset</dt><dd>sregym_jaeger</dd><dt>Execution</dt><dd>RemoteMCPTool → SREGym Python handler → Jaeger GET /api/traces with service/time filters</dd><dt>Returns</dt><dd>Application request traces as text</dd></dl><p><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L71-L108" target="_blank" rel="noopener noreferrer">get_traces</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L71-L108</small></p><pre><code>@mcp.tool(name=&quot;get_traces&quot;)
def get_traces(service: str, last_n_minutes: int) -&gt; str:
    &quot;&quot;&quot;Get Jaeger traces for a given service in the last n minutes.

    Args:
        service (str): The name of the service for which to retrieve trace data.
        last_n_minutes (int): The time range (in minutes) to look back from the current time.

    Returns:
        str: String of Jaeger traces or error information
    &quot;&quot;&quot;

    logger.debug(&quot;[ob_mcp] get_traces called, getting jaeger traces&quot;)

    jaeger_url = &quot;http://jaeger-out.observe.svc.cluster.local:16686&quot;
    jaeger_client = ObservabilityClient(jaeger_url)
    try:
        url = f&quot;{jaeger_url}/api/traces&quot;
        start_time = datetime.now() - timedelta(minutes=last_n_minutes)
        start_time = int(start_time.timestamp() * 1_000_000)
        end_time = int(datetime.now().timestamp() * 1_000_000)
        logger.debug(f&quot;[ob_mcp] get_traces start_time: {start_time}, end_time: {end_time}&quot;)
        params = {
            &quot;service&quot;: service,
            &quot;start&quot;: start_time,
            &quot;end&quot;: end_time,
            &quot;limit&quot;: 20,
        }
        response = jaeger_client.make_request(&quot;GET&quot;, url, params=params)
        logger.debug(f&quot;[ob_mcp] get_traces: {response.status_code}&quot;)
        traces = str(response.json()[&quot;data&quot;])
        result = traces if traces else &quot;None&quot;

        return result
    except Exception as e:
        err_str = f&quot;[ob_mcp] Error querying get_traces: {str(e)}&quot;
        logger.error(err_str)
        return err_str</code></pre></details><details class="tool-definition"><summary>get_dependency_graph</summary><dl class="tool-info"><dt>Toolset</dt><dd>sregym_jaeger</dd><dt>Execution</dt><dd>RemoteMCPTool → SREGym Python handler → Jaeger GET /api/dependencies with a time range</dd><dt>Returns</dt><dd>Service dependencies as text</dd></dl><p><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L111-L132" target="_blank" rel="noopener noreferrer">get_dependency_graph</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L111-L132</small></p><pre><code>@mcp.tool(name=&quot;get_dependency_graph&quot;)
def get_dependency_graph(last_n_minutes: int = 30) -&gt; str:
    &quot;&quot;&quot;
    Get service dependency graph from Jaeger&#x27;s native dependencies API.
    Args:
        last_n_minutes (int): The time range (in minutes) to look back from the current time.
    Returns:
        str: JSON object representing the dependency graph.
    &quot;&quot;&quot;

    jaeger_url = &quot;http://jaeger-out.observe.svc.cluster.local:16686&quot;
    client = ObservabilityClient(jaeger_url)
    end_time = int(datetime.now().timestamp() * 1000)

    url = f&quot;{jaeger_url}/api/dependencies&quot;
    params = {&quot;endTs&quot;: end_time, &quot;lookback&quot;: last_n_minutes * 60 * 1000}

    response = client.make_request(&quot;GET&quot;, url, params=params)
    logger.info(f&quot;[ob_mcp] get_dependency_graph: {response.status_code}&quot;)
    result = str(response.json())

    return result</code></pre></details><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L13-L38" target="_blank" rel="noopener noreferrer">get_services</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L13-L38</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L41-L68" target="_blank" rel="noopener noreferrer">get_operations</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L41-L68</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L71-L108" target="_blank" rel="noopener noreferrer">get_traces</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L71-L108</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L111-L132" target="_blank" rel="noopener noreferrer">get_dependency_graph</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L111-L132</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/utils.py#L48-L59" target="_blank" rel="noopener noreferrer">ObservabilityClient.create_retrying_session</a><small class="source-path">SREGym: mcp_server/utils.py:L48-L59</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/utils.py#L61-L71" target="_blank" rel="noopener noreferrer">ObservabilityClient.make_request</a><small class="source-path">SREGym: mcp_server/utils.py:L61-L71</small></li></ul></div></template>
<template id="detail-kubernetes" data-title="Kubernetes API server"><div class="detail-body"><p class="owner">MODEL / CLUSTER BACKEND</p><p>Serve Kubernetes data and accept permitted resource changes.</p><dl><dt>Input</dt><dd><ul><li>Resource, pod-log, resource-metric and service-proxy requests forwarded by SREGym’s access proxy.</li></ul></dd><dt>Output</dt><dd><ul><li>Resource JSON, pod log text, CPU/memory usage, operation status or errors.</li><li>Prometheus target JSON when service-proxy access is permitted.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Serve object reads and pod-log requests for the test application and its dependencies.</li><li>Serve resource-metric requests used by kubectl top through the Kubernetes Metrics API. Metrics Server supplies the recent CPU/memory measurements.</li><li>Accept permitted resource writes. Kubernetes controllers act on the requested state of the deployed application.</li><li>When access permits target lookup, forward it to Prometheus /api/v1/targets through the service proxy.</li></ul></dd></dl><h3>Related Sources</h3><p class="source-note">Caller code for these backend requests.</p><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L17-L700" target="_blank" rel="noopener noreferrer">holmes/plugins/toolsets/kubernetes.yaml</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L17-L700</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes_logs.py#L89-L248" target="_blank" rel="noopener noreferrer">holmes/plugins/toolsets/kubernetes_logs.py</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes_logs.py:L89-L248</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/service/container_runner.py#L446-L568" target="_blank" rel="noopener noreferrer">sregym/service/container_runner.py</a><small class="source-path">SREGym: sregym/service/container_runner.py:L446-L568</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L660-L680" target="_blank" rel="noopener noreferrer">CPU/memory snapshot commands</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L660-L680</small></li></ul></div></template>
<template id="detail-prometheus" data-title="Prometheus"><div class="detail-body"><p class="owner">MODEL / CLUSTER BACKEND</p><p>Evaluate metric queries and provide monitoring data.</p><dl><dt>Input</dt><dd><ul><li>Metric queries and alert requests from the SREGym tool server.</li><li>Target lookup requests through the Kubernetes service proxy.</li></ul></dd><dt>Output</dt><dd><ul><li>Metric values, alerts or target details as JSON.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Evaluate PromQL against stored metric samples.</li><li>Serve alert data through /api/v1/alerts and collection-target details through /api/v1/targets.</li><li>Return JSON for the requesting tool server or local script to process.</li></ul></dd></dl><h3>Related Sources</h3><p class="source-note">Caller code for these backend requests.</p><ul class="sources"><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/prometheus_server.py#L13-L79" target="_blank" rel="noopener noreferrer">mcp_server/prometheus_server.py</a><small class="source-path">SREGym: mcp_server/prometheus_server.py:L13-L79</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L689-L700" target="_blank" rel="noopener noreferrer">holmes/plugins/toolsets/kubernetes.yaml</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L689-L700</small></li></ul></div></template>
<template id="detail-jaeger" data-title="Jaeger"><div class="detail-body"><p class="owner">MODEL / CLUSTER BACKEND</p><p>Find application request traces.</p><dl><dt>Input</dt><dd><ul><li>HTTP requests with service names or time ranges from the Jaeger tool server.</li></ul></dd><dt>Output</dt><dd><ul><li>Service names, operations, request traces or dependencies as JSON.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Search traces: records of request operations across the application’s services.</li><li>Return matching data to the tool server.</li><li>Store application traces, which are separate from the agent conversation saved as a trajectory.</li></ul></dd></dl><h3>Related Sources</h3><p class="source-note">Caller code for these backend requests.</p><ul class="sources"><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/mcp_server/jaeger_server.py#L14-L132" target="_blank" rel="noopener noreferrer">mcp_server/jaeger_server.py</a><small class="source-path">SREGym: mcp_server/jaeger_server.py:L14-L132</small></li></ul></div></template>
<template id="detail-observations" data-title="ToolCallResult"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Format each tool result for the conversation.</p><dl><dt>Input</dt><dd><ul><li>Tool results after command execution, local processing or MCP reply handling, including images.</li><li>Errors and permission rejections.</li></ul></dd><dt>Output</dt><dd><ul><li>Conversation messages containing formatted tool results, call IDs and supported image content.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Format each result with its effective parameters, output, metadata and any error text. Include returned images when the model supports vision.</li><li>Append messages through ToolCallingLLM as calls finish. Start the next model turn after the batch finishes.</li><li>For oversized results, store text/images in the agent’s result directory and return file paths with a preview. Bash and read_image_file can retrieve needed content.</li><li>The formatted model message can differ from the client result data used by the trajectory exporter.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/models.py#L19-L46" target="_blank" rel="noopener noreferrer">ToolCallResult.to_llm_message</a><small class="source-path">holmesgpt: holmes/core/models.py:L19-L46</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/models.py#L83-L107" target="_blank" rel="noopener noreferrer">format_tool_result_data</a><small class="source-path">holmesgpt: holmes/core/models.py:L83-L107</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L1508-L1595" target="_blank" rel="noopener noreferrer">ToolCallingLLM.call_stream: append tool messages and finish the batch</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L1508-L1595</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L1078-L1113" target="_blank" rel="noopener noreferrer">ToolCallingLLM._invoke_llm_tool_call: limit oversized results</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L1078-L1113</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools_utils/tool_context_window_limiter.py#L33-L144" target="_blank" rel="noopener noreferrer">spill_oversized_tool_result</a><small class="source-path">holmesgpt: holmes/core/tools_utils/tool_context_window_limiter.py:L33-L144</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools_utils/filesystem_result_storage.py#L25-L40" target="_blank" rel="noopener noreferrer">tool_result_storage</a><small class="source-path">holmesgpt: holmes/core/tools_utils/filesystem_result_storage.py:L25-L40</small></li></ul></div></template>
<template id="detail-submit" data-title="Stage adapter (submission)"><div class="detail-body"><p class="owner">OUR INTEGRATION</p><p>Submit the answer for evaluation.</p><dl><dt>Input</dt><dd><ul><li>Final nonempty answer returned by HolmesGPT.</li></ul></dd><dt>Output</dt><dd><ul><li>POST /submit with the exact answer and stage.</li><li>SREGym submission receipt and, after evaluation, the next stage or end of the test case.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Send the answer without rewriting or evaluating it.</li><li>Wait for SREGym’s evaluation and stage transition. The diagnosis judge and mitigation checks belong to SREGym.</li><li>If another stage is enabled, configure HolmesGPT for it with the retained conversation.</li><li>Keep SREGym’s shared 1,800-second deadline across stages. Starting a new agent instance does not extend it.</li><li>While the agent runs, record HolmesGPT events/conversation separately from our added records. Recording preserves return values, adds I/O overhead and reports incomplete capture.</li><li>After collection, convert saved records to trajectory.json offline. Exported client tool results can differ from the formatted messages sent to the model.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="../../../runtime/agent.py" target="_blank" rel="noopener noreferrer">runtime/agent.py</a><small class="source-path">parent: runtime/agent.py</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor_api.py#L219-L267" target="_blank" rel="noopener noreferrer">sregym/conductor/conductor_api.py</a><small class="source-path">SREGym: sregym/conductor/conductor_api.py:L219-L267</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L652-L817" target="_blank" rel="noopener noreferrer">sregym/conductor/conductor.py</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L652-L817</small></li><li><a href="../../../runtime/recording.py" target="_blank" rel="noopener noreferrer">Incremental recorder</a><small class="source-path">parent: runtime/recording.py</small></li><li><a href="../../../runtime/convert.py" target="_blank" rel="noopener noreferrer">Offline trajectory converter</a><small class="source-path">parent: runtime/convert.py</small></li></ul></div></template>
<dialog aria-labelledby="card-title"><header class="card-header"><h2 id="card-title"></h2><form method="dialog"><button>Close</button></form></header><div id="card-body"></div></dialog>
<script>
const dialog = document.querySelector('dialog');
let opener;
document.querySelector('figure').addEventListener('click', event => {
  const link = event.target.closest('a');
  const href = link?.getAttribute('href') || link?.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
  if (!href?.startsWith('#detail-') || !dialog.showModal) return;
  const detail = document.getElementById(href.slice(1));
  if (!detail) return;
  event.preventDefault();
  opener = link;
  document.getElementById('card-title').textContent = detail.dataset.title;
  document.getElementById('card-body').replaceChildren(detail.content.cloneNode(true));
  dialog.showModal();
  dialog.scrollTop = 0;
});
dialog.addEventListener('close', () => opener?.focus());
</script></main></body></html>
