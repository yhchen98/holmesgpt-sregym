<template id="detail-stage" data-title="Conductor"><div class="detail-body"><p class="owner">SREGYM</p><p>Prepare a test case and report its current stage.</p><dl><dt>Input</dt><dd><ul><li>Problem: a SREGym test case, with its deployment, fault and evaluation rules.</li><li>Requests for the current stage and application details.</li></ul></dd><dt>Output</dt><dd><ul><li>Current stage: diagnosis (find the cause) or mitigation (repair the failure).</li><li>Application description, relevant namespaces and enabled stages.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Deploy the application: the services under test, including any supporting databases.</li><li>Apply the fault: the change that causes the failure being tested.</li><li>Expose stage and application details through GET /status and GET /get_app.</li><li>Evaluate diagnosis with the case’s diagnosis oracle, which can use an LLM judge. Evaluate mitigation against the system/application state, then advance stages or restore the environment.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L652-L758" target="_blank" rel="noopener noreferrer">Conductor.start_problem</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L652-L758</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L1384-L1513" target="_blank" rel="noopener noreferrer">Conductor.deploy_app</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L1384-L1513</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L320-L345" target="_blank" rel="noopener noreferrer">Conductor._inject_fault</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L320-L345</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L420-L473" target="_blank" rel="noopener noreferrer">Conductor._advance_to_next_stage</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L420-L473</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor_api.py#L233-L248" target="_blank" rel="noopener noreferrer">get_status</a><small class="source-path">SREGym: sregym/conductor/conductor_api.py:L233-L248</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor_api.py#L251-L267" target="_blank" rel="noopener noreferrer">get_app</a><small class="source-path">SREGym: sregym/conductor/conductor_api.py:L251-L267</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L760-L882" target="_blank" rel="noopener noreferrer">Conductor._submit_evaluate_and_advance</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L760-L882</small></li><li><a href="https://github.com/SREGym/SREGym/blob/0d8e7b73214c44e99c97ca1af2934290aa3b826b/sregym/conductor/conductor.py#L475-L568" target="_blank" rel="noopener noreferrer">Conductor._cleanup_sync</a><small class="source-path">SREGym: sregym/conductor/conductor.py:L475-L568</small></li></ul></div></template>
<template id="detail-adapter" data-title="Stage adapter (setup)"><div class="detail-body"><p class="owner">OUR INTEGRATION</p><p>Configure HolmesGPT for the current stage.</p><dl><dt>Input</dt><dd><ul><li>Current stage and application details from SREGym.</li><li>Conversation from the previous stage, when available.</li></ul></dd><dt>Output</dt><dd><ul><li>Initial conversation built with the HolmesGPT prompt builder.</li><li>Configured HolmesGPT agent, started through ai.call(messages).</li></ul></dd><dt>Behavior</dt><dd><ul><li>Load HolmesGPT toolsets tagged CORE or CLI and check their configuration and prerequisites. Configure the Bash policy and SREGym Prometheus/Jaeger MCP servers.</li><li>Use HolmesGPT’s prompt builder for the system and user messages. Add stage-permission guidance and the configured MCP toolset instructions to the system prompt.</li><li>Supply the user task: diagnosis or mitigation, application description, relevant namespaces and investigation scope.</li><li>Keep diagnosis read-only. Permit the selected Kubernetes write commands during mitigation under the Bash allow/deny rules.</li><li>Select the model and allow 100 agent iterations per stage. One iteration can request several tools. For Sonnet 5.5, omit the rejected temperature setting.</li><li>For the next stage, create an agent instance with new system instructions. Retain previous non-system messages and the shared tool-result directory.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="../../../runtime/agent.py" target="_blank" rel="noopener noreferrer">runtime/agent.py</a><small class="source-path">parent: runtime/agent.py</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/prompt.py#L335-L364" target="_blank" rel="noopener noreferrer">holmes/core/prompt.py</a><small class="source-path">holmesgpt: holmes/core/prompt.py:L335-L364</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/prompt.py#L206-L254" target="_blank" rel="noopener noreferrer">build_system_prompt</a><small class="source-path">holmesgpt: holmes/core/prompt.py:L206-L254</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/prompts/generic_ask.jinja2#L1-L132" target="_blank" rel="noopener noreferrer">System prompt template</a><small class="source-path">holmesgpt: holmes/plugins/prompts/generic_ask.jinja2:L1-L132</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/prompts/base_user_prompt.jinja2#L1-L46" target="_blank" rel="noopener noreferrer">User prompt template</a><small class="source-path">holmesgpt: holmes/plugins/prompts/base_user_prompt.jinja2:L1-L46</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/config.py#L443-L454" target="_blank" rel="noopener noreferrer">Toolset tag selection and prerequisite controls</a><small class="source-path">holmesgpt: holmes/config.py:L443-L454</small></li></ul></div></template>
<template id="detail-request" data-title="ToolCallingLLM / DefaultLLM"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Prepare conversation context and send the model request.</p><dl><dt>Input</dt><dd><ul><li>Stage instructions, earlier model replies and tool messages.</li><li>Available tool definitions and model settings.</li></ul></dd><dt>Output</dt><dd><ul><li>Model request containing the current conversation and callable tools.</li></ul></dd><dt>Behavior</dt><dd><ul><li>ToolCallingLLM manages the conversation and context budget. When compaction is needed, summarize older messages through the configured model client.</li><li>DefaultLLM sends a model request through LiteLLM and returns the response to ToolCallingLLM.</li><li>On the last allowed iteration, omit tools to request a final answer. Provider errors or cancellation can end the call earlier.</li></ul></dd></dl><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L1220-L1308" target="_blank" rel="noopener noreferrer">ToolCallingLLM.call_stream: prepare context and call the model</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L1220-L1308</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/llm.py#L712-L843" target="_blank" rel="noopener noreferrer">DefaultLLM.completion</a><small class="source-path">holmesgpt: holmes/core/llm.py:L712-L843</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/truncation/input_context_window_limiter.py#L82-L205" target="_blank" rel="noopener noreferrer">compact_if_necessary</a><small class="source-path">holmesgpt: holmes/core/truncation/input_context_window_limiter.py:L82-L205</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/truncation/compaction.py#L352-L517" target="_blank" rel="noopener noreferrer">compact_conversation_history</a><small class="source-path">holmesgpt: holmes/core/truncation/compaction.py:L352-L517</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools_utils/tool_executor.py#L178-L189" target="_blank" rel="noopener noreferrer">ToolExecutor.get_all_tools_openai_format</a><small class="source-path">holmesgpt: holmes/core/tools_utils/tool_executor.py:L178-L189</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L284-L299" target="_blank" rel="noopener noreferrer">ToolCallingLLM: model-client reference</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L284-L299</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/config.py#L754-L769" target="_blank" rel="noopener noreferrer">Create the model client and agent loop</a><small class="source-path">holmesgpt: holmes/config.py:L754-L769</small></li></ul></div></template>
<template id="detail-model" data-title="LLM"><div class="detail-body"><p class="owner">MODEL / CLUSTER BACKEND</p><p>Choose tool calls or return a final answer.</p><dl><dt>Input</dt><dd><ul><li>Current conversation and available tool definitions.</li></ul></dd><dt>Output</dt><dd><ul><li>Model reply, optionally containing several tool calls with names, arguments and call IDs.</li><li>Final answer when the reply contains no tool calls.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Use the conversation and tool descriptions to choose actions.</li><li>Supply query expressions or shell commands when the selected tool requires them.</li><li>Return tool calls for HolmesGPT to execute. Text alongside a tool call does not end the agent loop.</li></ul></dd></dl><h3>Related Sources</h3><p class="source-note">Caller code for these backend requests.</p><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L1295-L1467" target="_blank" rel="noopener noreferrer">holmes/core/tool_calling_llm.py</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L1295-L1467</small></li></ul></div></template>
<template id="detail-dispatch" data-title="ToolCallingLLM / ToolExecutor"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Send each requested call to its tool implementation.</p><dl><dt>Input</dt><dd><ul><li>Tool calls from one model reply, including names, arguments and call IDs.</li></ul></dd><dt>Output</dt><dd><ul><li>Calls to the selected tool implementations.</li><li>Error results for invalid calls or denied actions.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Append the model reply and its requested calls to the conversation before execution.</li><li>Parse call arguments and resolve each name through ToolExecutor. Apply the SDK’s repeated-call check, parameter conversion and approval rules.</li><li>Execute the requested batch with up to 16 workers. Tool errors and denied actions become results for the model.</li><li>Keep each result associated with its call ID. Calls can finish in a different order from their requests.</li></ul></dd></dl><h3>Tools by implementation</h3><ul><li><b>YAMLTool</b>: <code>kubernetes_jq_query</code>, <code>kubernetes_tabular_query</code>, <code>kubernetes_count</code>, <code>kubectl_top_pods</code>, <code>kubectl_top_nodes</code>, <code>get_prometheus_target</code></li><li><b>RunBashCommand</b>: <code>bash</code></li><li><b>Python Tool classes</b>: <code>fetch_pod_logs</code>, <code>TodoWrite</code>, <code>fetch_webpage</code>, <code>tcp_check</code>, <code>read_image_file</code>, <code>fetch_skill</code></li><li><b>Prometheus MCP server</b>: <code>get_metrics</code>, <code>get_alerts</code></li><li><b>Jaeger MCP server</b>: <code>get_services</code>, <code>get_operations</code>, <code>get_traces</code>, <code>get_dependency_graph</code></li></ul><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L1405-L1595" target="_blank" rel="noopener noreferrer">ToolCallingLLM.call_stream: tool batches and results</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L1405-L1595</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L987-L1113" target="_blank" rel="noopener noreferrer">ToolCallingLLM._invoke_llm_tool_call</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L987-L1113</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tool_calling_llm.py#L864-L924" target="_blank" rel="noopener noreferrer">ToolCallingLLM._directly_invoke_tool_call</a><small class="source-path">holmesgpt: holmes/core/tool_calling_llm.py:L864-L924</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools_utils/tool_executor.py#L100-L108" target="_blank" rel="noopener noreferrer">ToolExecutor.get_tool_by_name</a><small class="source-path">holmesgpt: holmes/core/tools_utils/tool_executor.py:L100-L108</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools.py#L392-L437" target="_blank" rel="noopener noreferrer">Tool.invoke</a><small class="source-path">holmesgpt: holmes/core/tools.py:L392-L437</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools.py#L377-L383" target="_blank" rel="noopener noreferrer">Tool._coerce_params</a><small class="source-path">holmesgpt: holmes/core/tools.py:L377-L383</small></li></ul></div></template>
<template id="detail-yaml" data-title="YAMLTool"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Run Kubernetes queries, resource counts and usage checks.</p><dl><dt>Input</dt><dd><ul><li>kubernetes_jq_query and kubernetes_count: resource kind, namespace, selectors and a jq expression (a JSON filter).</li><li>kubernetes_tabular_query: resource kind, namespace, selectors, columns and a row filter.</li><li>kubectl_top_pods and kubectl_top_nodes: no arguments.</li><li>get_prometheus_target: Prometheus service, namespace and target name.</li></ul></dd><dt>Output</dt><dd><ul><li>Selected resource JSON, counts/previews, table rows, CPU/memory usage or target details.</li><li>Tool status, the executed command and any errors.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Render a fixed command or a parameterized Bash script from the YAML definition. Template variables supply any inferred parameters.</li><li>Run kubectl inside the agent container through SREGym’s Kubernetes access proxy.</li><li>For JSON queries and counts, discover resources and retrieve pages as needed. Run jq locally to select or count the results.</li><li>For table queries, request custom columns and filter rows locally.</li><li>For CPU/memory snapshots, run kubectl top against the Kubernetes Metrics API.</li><li>For target lookup, request Prometheus /api/v1/targets through the Kubernetes service proxy, then select the target locally. Access rules can reject the request.</li><li>Apply configured output summarization when a fast model is available and output exceeds its threshold.</li></ul></dd></dl><h3>Tool definitions</h3><details class="tool-definition"><summary>kubernetes_jq_query</summary><dl class="tool-info"><dt>Toolset</dt><dd>kubernetes/core</dd><dt>Execution</dt><dd>YAMLTool script → kubectl discovery/paginated reads → local jq</dd><dt>Returns</dt><dd>Selected JSON, scope, counts and errors</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L17-L261" target="_blank" rel="noopener noreferrer">kubernetes_jq_query</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L17-L261</small></p><pre><code>      - name: &quot;kubernetes_jq_query&quot;
        user_description: &quot;jq query: kubectl get {{kind}} | jq &#x27;{{jq_expr}}&#x27; (namespace={{namespace if namespace is string}}, label_selector={{label_selector}}, field_selector={{field_selector}})&quot;
        description: &gt;
          Use kubectl to get json for all resources of a specific kind and filter with jq.
          Prefer over bash for large queries - paginates via the Kubernetes API so large
          clusters don&#x27;t overflow context.
          If you know the namespace or labels of the resources you need, pass namespace,
          label_selector and/or field_selector so filtering happens server-side; unscoped
          queries can be slow on large clusters.
          Returns a JSON object with keys: &quot;total_items_processed&quot;, &quot;matches_found&quot;,
          &quot;results&quot; (array of matching resources), &quot;stderr&quot; (error output or null),
          &quot;scope&quot; (the resource, namespace and selectors actually queried), and
          &quot;notes&quot; (e.g. a namespace ignored for a cluster-scoped kind).
          The &#x27;kind&#x27; parameter must be the plural form of the resource type
          (e.g., &quot;pods&quot; not &quot;pod&quot;, &quot;jobs&quot; not &quot;job&quot;).
          Do not worry about escaping the jq_expr - it will be done by the system.
          Example: .items[] | .spec.containers[].image | select(test(&quot;^gcr.io/&quot;) | not)
        parameters:
          namespace:
            type: string
            required: false
            description: &quot;Only query resources in this namespace. Ignored for cluster-scoped kinds such as nodes.&quot;
          label_selector:
            type: string
            required: false
            description: &quot;Kubernetes label selector applied server-side, e.g. &#x27;app=web,tier!=db&#x27; or &#x27;env in (prod,staging)&#x27;.&quot;
          field_selector:
            type: string
            required: false
            description: &quot;Kubernetes field selector applied server-side. All kinds support metadata.name and metadata.namespace; pods also support status.phase and spec.nodeName, e.g. &#x27;status.phase!=Running&#x27;.&quot;
        script: |
          #!/bin/bash

          # SECURITY: assign sanitized params to shell variables in an unquoted
          # assignment slot, then reference them only as &quot;$VAR&quot;. Never interpolate
          # {{ param }} inside a quoted context - sanitize() (shlex.quote) wraps
          # dangerous values in single quotes, which are literal (and command
          # substitution stays active) inside a double-quoted or single-quoted slot.
          KIND={{ kind }}
          # &#x27;namespace&#x27; is also a Jinja global (namespace()), so it is defined even when omitted
          SEL_NAMESPACE={{ namespace if namespace is string else &quot;&quot; }}
          SEL_LABELS={{ label_selector }}
          SEL_FIELDS={{ field_selector }}
          # Strict tool calls send null for unset optional params, which renders as &#x27;None&#x27;
          [ &quot;$SEL_NAMESPACE&quot; = &quot;None&quot; ] &amp;&amp; SEL_NAMESPACE=&quot;&quot;
          [ &quot;$SEL_LABELS&quot; = &quot;None&quot; ] &amp;&amp; SEL_LABELS=&quot;&quot;
          [ &quot;$SEL_FIELDS&quot; = &quot;None&quot; ] &amp;&amp; SEL_FIELDS=&quot;&quot;

          # Collapse multi-line jq expressions (LLMs sometimes write multi-line jq)
          # Note: use $&#x27;\n&#x27; syntax instead of &#x27;\n&#x27; because Jinja2 interprets \n as literal newlines
          JQ_FILTER={{ jq_expr }}
          JQ_FILTER=$(printf &#x27;%s&#x27; &quot;$JQ_FILTER&quot; | tr $&#x27;\n\r&#x27; &#x27;  &#x27;)

          err_file=$(mktemp)
          PROCESSED=0
          NOTES=&#x27;[]&#x27;
          SCOPE=&#x27;null&#x27;

          add_note() {
            NOTES=$(jq -c --arg note &quot;$1&quot; &#x27;. + [$note]&#x27; &lt;&lt;&lt; &quot;$NOTES&quot;)
          }

          uri_encode() {
            jq -rn --arg v &quot;$1&quot; &#x27;$v|@uri&#x27;
          }

          fail() {
            err_content=$(cat &quot;$err_file&quot; 2&gt;/dev/null)
            rm -f &quot;$err_file&quot;
            jq -n --arg stderr &quot;$1 $err_content&quot; --argjson total &quot;$PROCESSED&quot; --argjson notes &quot;$NOTES&quot; --argjson scope &quot;$SCOPE&quot; \
              &#x27;{total_items_processed: $total, matches_found: 0, results: [], stderr: $stderr, scope: $scope, notes: $notes}&#x27;
            exit 0
          }

          # The namespace becomes part of the raw API path, so anything other than a valid
          # namespace name (e.g. &#x27;default/services/x:80/proxy/?&#x27;) could reach other API endpoints
          if [ -n &quot;$SEL_NAMESPACE&quot; ] &amp;&amp; ! [[ &quot;$SEL_NAMESPACE&quot; =~ ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$ ]]; then
            fail &quot;Invalid namespace &#x27;${SEL_NAMESPACE}&#x27;: must be a Kubernetes namespace name (lowercase letters, digits and &#x27;-&#x27;).&quot;
          fi

          # Get the API path for the resource kind using kubectl
          # Match the resource name (first column) as an EXACT string, not a
          # grep regex - otherwise a kind like &#x27;.*&#x27; or &#x27;a|b&#x27; would match the
          # wrong resource.
          CANDIDATES=$(kubectl api-resources --no-headers 2&gt;&gt;&quot;$err_file&quot; | awk -v kind=&quot;$KIND&quot; &#x27;$1 == kind&#x27;)
          API_INFO=$(printf &#x27;%s\n&#x27; &quot;$CANDIDATES&quot; | head -1)
          # `kubectl api-resources` sorts by group name, so a CRD reusing a built-in
          # plural (e.g. Calico&#x27;s crd.projectcalico.org networkpolicies) can be listed
          # before networking.k8s.io. Pick what `kubectl get` picks: the core group,
          # then the first group in server discovery order (/apis).
          if [ &quot;$(printf &#x27;%s\n&#x27; &quot;$CANDIDATES&quot; | grep -c .)&quot; -gt 1 ] &amp;&amp; [[ &quot;$API_INFO&quot; != *&quot; v1 &quot;* ]]; then
            API_GROUPS=$(kubectl get --raw /apis 2&gt;/dev/null | jq -r &#x27;.groups[].name&#x27; 2&gt;/dev/null)
            if [ -z &quot;$API_GROUPS&quot; ]; then
              add_note &quot;Several API groups serve &#x27;${KIND}&#x27; and server discovery (/apis) failed, so the first group listed by kubectl api-resources was used.&quot;
            fi
            for group in $API_GROUPS; do
              match=$(printf &#x27;%s\n&#x27; &quot;$CANDIDATES&quot; | grep -F &quot; $group/&quot; | head -1)
              if [ -n &quot;$match&quot; ]; then
                API_INFO=&quot;$match&quot;
                break
              fi
            done
          fi

          if [ -z &quot;$API_INFO&quot; ]; then
            fail &quot;Unable to find resource kind &#x27;${KIND}&#x27;.&quot;
          fi

          # Extract NAMESPACED value
          if [[ &quot;$API_INFO&quot; == *&quot; true &quot;* ]]; then
            NAMESPACED=true
            PREFIX=$(echo &quot;$API_INFO&quot; | sed &#x27;s/ true .*//&#x27;)
          elif [[ &quot;$API_INFO&quot; == *&quot; false &quot;* ]]; then
            NAMESPACED=false
            PREFIX=$(echo &quot;$API_INFO&quot; | sed &#x27;s/ false .*//&#x27;)
          else
            fail &quot;Could not parse API info for &#x27;${KIND}&#x27;.&quot;
          fi

          # Trim trailing spaces from prefix and collapse internal spaces
          PREFIX=$(echo &quot;$PREFIX&quot; | sed &#x27;s/  *$//&#x27; | sed &#x27;s/  */ /g&#x27;)

          IFS=&#x27; &#x27; read -ra PREFIX_FIELDS &lt;&lt;&lt; &quot;$PREFIX&quot;
          FIELD_COUNT=0
          for field in &quot;${PREFIX_FIELDS[@]}&quot;; do
            ((FIELD_COUNT++))
          done

          RESOURCE_NAME=&quot;${PREFIX_FIELDS[0]}&quot;
          if [ $FIELD_COUNT -ge 2 ]; then
            API_VERSION=&quot;${PREFIX_FIELDS[$((FIELD_COUNT - 1))]}&quot;
          else
            API_VERSION=&quot;&quot;
          fi

          if [ -z &quot;$API_VERSION&quot; ] || [ -z &quot;$RESOURCE_NAME&quot; ]; then
            fail &quot;Unable to parse API info for resource kind &#x27;${KIND}&#x27;.&quot;
          fi

          # Build API path: namespaced kinds can be listed within one namespace;
          # cluster-scoped kinds ignore the namespace (as kubectl does)
          if [[ &quot;$API_VERSION&quot; == &quot;v1&quot; ]]; then
            API_BASE=&quot;/api/v1&quot;
          else
            API_BASE=&quot;/apis/${API_VERSION}&quot;
          fi
          if [ -n &quot;$SEL_NAMESPACE&quot; ] &amp;&amp; [ &quot;$NAMESPACED&quot; = &quot;true&quot; ]; then
            API_PATH=&quot;${API_BASE}/namespaces/${SEL_NAMESPACE}/${RESOURCE_NAME}&quot;
          else
            if [ -n &quot;$SEL_NAMESPACE&quot; ]; then
              add_note &quot;namespace &#x27;${SEL_NAMESPACE}&#x27; ignored: ${RESOURCE_NAME} is cluster-scoped.&quot;
              SEL_NAMESPACE=&quot;&quot;
            fi
            API_PATH=&quot;${API_BASE}/${RESOURCE_NAME}&quot;
          fi

          SELECTOR_QUERY=&quot;&quot;
          if [ -n &quot;$SEL_LABELS&quot; ]; then
            SELECTOR_QUERY=&quot;${SELECTOR_QUERY}&amp;labelSelector=$(uri_encode &quot;$SEL_LABELS&quot;)&quot;
          fi
          if [ -n &quot;$SEL_FIELDS&quot; ]; then
            SELECTOR_QUERY=&quot;${SELECTOR_QUERY}&amp;fieldSelector=$(uri_encode &quot;$SEL_FIELDS&quot;)&quot;
          fi

          SCOPE=$(jq -nc --arg resource &quot;$RESOURCE_NAME&quot; --arg api_version &quot;$API_VERSION&quot; \
            --arg namespace &quot;$SEL_NAMESPACE&quot; --arg labels &quot;$SEL_LABELS&quot; --arg fields &quot;$SEL_FIELDS&quot; \
            &#x27;{resource: $resource, api_version: $api_version,
              namespace: (if $namespace == &quot;&quot; then null else $namespace end),
              label_selector: (if $labels == &quot;&quot; then null else $labels end),
              field_selector: (if $fields == &quot;&quot; then null else $fields end)}&#x27;)

          # Process resources in chunks using API pagination
          LIMIT=500
          CONTINUE=&quot;&quot;
          TOTAL_MATCHES=0
          ALL_MATCHES=&quot;&quot;

          while true; do
            QUERY=&quot;${API_PATH}?limit=${LIMIT}${SELECTOR_QUERY}&quot;
            if [ -n &quot;$CONTINUE&quot; ]; then
              # continue tokens are base64 and may contain &#x27;+&#x27;, &#x27;/&#x27; or &#x27;=&#x27;
              QUERY=&quot;${QUERY}&amp;continue=$(uri_encode &quot;$CONTINUE&quot;)&quot;
            fi

            OUTPUT=$(kubectl get --raw &quot;$QUERY&quot; 2&gt;&gt;&quot;$err_file&quot;)
            exit_code=$?

            if [ $exit_code -ne 0 ]; then
              fail &quot;kubectl get --raw failed for $QUERY.&quot;
            fi

            ITEMS_COUNT=$(echo &quot;$OUTPUT&quot; | jq &#x27;.items | length&#x27;)

            MATCHES=$(echo &quot;$OUTPUT&quot; | jq -c &quot;$JQ_FILTER&quot; 2&gt;&gt;&quot;$err_file&quot;)
            jq_exit=$?
            if [ $jq_exit -ne 0 ]; then
              fail &quot;jq expression failed.&quot;
            fi

            if [ &quot;$ITEMS_COUNT&quot; -gt 0 ]; then
              if [ -n &quot;$MATCHES&quot; ]; then
                if [ -z &quot;$ALL_MATCHES&quot; ]; then
                  ALL_MATCHES=&quot;$MATCHES&quot;
                else
                  ALL_MATCHES=&quot;$ALL_MATCHES&quot;$&#x27;\n&#x27;&quot;$MATCHES&quot;
                fi
                MATCH_COUNT=$(echo &quot;$MATCHES&quot; | grep -c . || true)
                TOTAL_MATCHES=$((TOTAL_MATCHES + MATCH_COUNT))
              fi
              PROCESSED=$((PROCESSED + ITEMS_COUNT))
            fi

            CONTINUE=$(echo &quot;$OUTPUT&quot; | jq -r &#x27;.metadata.continue // empty&#x27;)

            if [ -z &quot;$CONTINUE&quot; ]; then
              break
            fi
          done

          err_content=$(cat &quot;$err_file&quot; 2&gt;/dev/null)
          rm -f &quot;$err_file&quot;

          # Output results as a JSON object with metadata. Results go through stdin, not --argjson:
          # Linux caps a single argument at 128KB, so larger results failed with &quot;Argument list too long&quot;.
          printf &#x27;%s\n&#x27; &quot;$ALL_MATCHES&quot; | jq -s \
            --argjson total_items_processed &quot;$PROCESSED&quot; \
            --argjson matches_found &quot;$TOTAL_MATCHES&quot; \
            --arg stderr &quot;$err_content&quot; \
            --argjson scope &quot;$SCOPE&quot; \
            --argjson notes &quot;$NOTES&quot; \
            &#x27;{total_items_processed: $total_items_processed, matches_found: $matches_found, results: ., stderr: (if $stderr == &quot;&quot; then null else $stderr end), scope: $scope, notes: $notes}&#x27;
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 10000
              prompt: |
                Summarize this jq query output focusing on:
                - Key patterns and commonalities in the data
                - Notable outliers, anomalies, or items that need attention
                - Group similar results into aggregate descriptions when possible
                - Highlight any empty results, null values, or missing data
                - When applicable, mention specific resource names, namespaces, or values that stand out
                - Organize findings in a structured way that helps with troubleshooting
                - Be concise: aim for ≤ 50% of the original text; prioritize aggregates and actionable outliers
                - Include grep-ready keys/values; avoid repeating entire objects or unchanged defaults</code></pre></details><details class="tool-definition"><summary>kubernetes_tabular_query</summary><dl class="tool-info"><dt>Toolset</dt><dd>kubernetes/core</dd><dt>Execution</dt><dd>YAMLTool script → kubectl custom columns → local row filtering</dd><dt>Returns</dt><dd>Table rows, headers, count and errors</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L263-L417" target="_blank" rel="noopener noreferrer">kubernetes_tabular_query</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L263-L417</small></p><pre><code>      - name: &quot;kubernetes_tabular_query&quot;
        user_description: &quot;filter: kubectl get {{kind}} columns=&#x27;{{columns}}&#x27; (namespace={{namespace if namespace is string}}, label_selector={{label_selector}}, field_selector={{field_selector}}, filter={{filter_pattern}})&quot;
        description: &gt;
          Extract specific fields from Kubernetes resources in tabular format with optional filtering.
          Returns a JSON object with keys: &quot;count&quot; (number of rows), &quot;header&quot; (column header line),
          &quot;rows&quot; (array of data rows), &quot;stderr&quot; (error output or null), &quot;scope&quot;
          (the namespace and selectors actually queried), and &quot;notes&quot; (e.g. a namespace
          ignored for a cluster-scoped kind).
          Only requested fields are transmitted, so it works well on large clusters.
          If you know the namespace or labels of the resources you need, pass namespace,
          label_selector and/or field_selector so filtering happens server-side; unscoped
          queries can be slow on large clusters.
          Column specification format: HEADER:FIELD_PATH,HEADER2:FIELD_PATH2,...
          e.g. NAME:.metadata.name,STATUS:.status.phase,IMAGE:.spec.containers[0].image
          Optional filter_pattern matches any column (grep regex), e.g. filter_pattern=&quot;Running&quot;.

          LIMITATIONS - not allowed characters in columns: &#x27; / ; and newline.
          Label keys containing dots or slashes (e.g. kubernetes.io/arch, app.kubernetes.io/name)
          CANNOT be queried with this tool because dots are path separators in JSONPath and
          slashes are forbidden characters. Use kubernetes_jq_query instead for labels with
          special characters, e.g.: .items[] | {name: .metadata.name, arch: .metadata.labels[&quot;kubernetes.io/arch&quot;]}
          Similarly, use .status.nodeInfo.architecture instead of .metadata.labels[&quot;kubernetes.io/arch&quot;] when possible.
        parameters:
          namespace:
            type: string
            required: false
            description: &quot;Only query resources in this namespace. Ignored for cluster-scoped kinds such as nodes.&quot;
          label_selector:
            type: string
            required: false
            description: &quot;Kubernetes label selector applied server-side, e.g. &#x27;app=web,tier!=db&#x27; or &#x27;env in (prod,staging)&#x27;. Unlike columns, label keys with dots or slashes work here.&quot;
          field_selector:
            type: string
            required: false
            description: &quot;Kubernetes field selector applied server-side. All kinds support metadata.name and metadata.namespace; pods also support status.phase and spec.nodeName, e.g. &#x27;status.phase!=Running&#x27;.&quot;
          filter_pattern:
            type: string
            required: false
            description: &quot;grep -E regex matched against each output row, e.g. &#x27;Running&#x27;.&quot;
        script: |
          #!/bin/bash
          # SECURITY: assign sanitized params to shell variables (unquoted slot),
          # then reference them only as &quot;$VAR&quot; - never interpolate {{ param }}
          # inside a quoted context. See kubernetes_jq_query for the rationale.
          KIND={{ kind }}
          CUSTOM_COLUMNS={{ columns }}
          # &#x27;namespace&#x27; is also a Jinja global (namespace()), so it is defined even when omitted
          SEL_NAMESPACE={{ namespace if namespace is string else &quot;&quot; }}
          SEL_LABELS={{ label_selector }}
          SEL_FIELDS={{ field_selector }}
          FILTER_PATTERN={{ filter_pattern }}
          # Strict tool calls send null for unset optional params, which renders as &#x27;None&#x27;
          [ &quot;$SEL_NAMESPACE&quot; = &quot;None&quot; ] &amp;&amp; SEL_NAMESPACE=&quot;&quot;
          [ &quot;$SEL_LABELS&quot; = &quot;None&quot; ] &amp;&amp; SEL_LABELS=&quot;&quot;
          [ &quot;$SEL_FIELDS&quot; = &quot;None&quot; ] &amp;&amp; SEL_FIELDS=&quot;&quot;
          [ &quot;$FILTER_PATTERN&quot; = &quot;None&quot; ] &amp;&amp; FILTER_PATTERN=&quot;&quot;

          # kubectl ignores -n for cluster-scoped kinds; say so instead of reporting a namespace that wasn&#x27;t applied
          NOTES=&#x27;[]&#x27;
          if [ -n &quot;$SEL_NAMESPACE&quot; ]; then
            is_kind() { awk -v kind=&quot;$KIND&quot; &#x27;$1 == kind || index($1, kind &quot;.&quot;) == 1 {found = 1} END {exit !found}&#x27;; }
            if kubectl api-resources --namespaced=false -o name 2&gt;/dev/null | is_kind \
              &amp;&amp; ! kubectl api-resources --namespaced=true -o name 2&gt;/dev/null | is_kind; then
              NOTES=$(jq -nc --arg note &quot;namespace &#x27;${SEL_NAMESPACE}&#x27; ignored: ${KIND} is cluster-scoped.&quot; &#x27;[$note]&#x27;)
              SEL_NAMESPACE=&quot;&quot;
            fi
          fi

          SCOPE_ARGS=()
          if [ -n &quot;$SEL_NAMESPACE&quot; ]; then
            SCOPE_ARGS+=(-n &quot;$SEL_NAMESPACE&quot;)
          else
            SCOPE_ARGS+=(--all-namespaces)
          fi
          if [ -n &quot;$SEL_LABELS&quot; ]; then
            SCOPE_ARGS+=(-l &quot;$SEL_LABELS&quot;)
          fi
          if [ -n &quot;$SEL_FIELDS&quot; ]; then
            SCOPE_ARGS+=(--field-selector &quot;$SEL_FIELDS&quot;)
          fi

          err_file=$(mktemp)
          output=$(kubectl get &quot;$KIND&quot; &quot;${SCOPE_ARGS[@]}&quot; -o custom-columns=&quot;$CUSTOM_COLUMNS&quot; 2&gt;&quot;$err_file&quot;)
          kubectl_exit=$?
          err_content=$(cat &quot;$err_file&quot; 2&gt;/dev/null)
          rm -f &quot;$err_file&quot;

          SCOPE=&#x27;null&#x27;
          if command -v jq &amp;&gt;/dev/null; then
            SCOPE=$(jq -nc --arg namespace &quot;$SEL_NAMESPACE&quot; --arg labels &quot;$SEL_LABELS&quot; --arg fields &quot;$SEL_FIELDS&quot; \
              &#x27;{namespace: (if $namespace == &quot;&quot; then null else $namespace end),
                label_selector: (if $labels == &quot;&quot; then null else $labels end),
                field_selector: (if $fields == &quot;&quot; then null else $fields end)}&#x27;)
          fi

          if [ $kubectl_exit -ne 0 ] || [ -z &quot;$output&quot; ]; then
            if command -v jq &amp;&gt;/dev/null; then
              jq -n --arg stderr &quot;$err_content&quot; --argjson scope &quot;$SCOPE&quot; --argjson notes &quot;$NOTES&quot; \
                &#x27;{count: 0, header: null, rows: [], stderr: $stderr, scope: $scope, notes: $notes}&#x27;
            else
              echo &quot;=== STDERR ===&quot;
              echo &quot;$err_content&quot;
              echo &quot;=== ROWS ===&quot;
              echo &quot;=== COUNT ===&quot;
              echo 0
            fi
            exit 0
          fi

          # Split header and data rows
          header=$(echo &quot;$output&quot; | head -1)
          if [ -n &quot;$FILTER_PATTERN&quot; ]; then
            data=$(echo &quot;$output&quot; | tail -n +2 | grep -E -- &quot;$FILTER_PATTERN&quot; || true)
          else
            data=$(echo &quot;$output&quot; | tail -n +2)
          fi

          if command -v jq &amp;&gt;/dev/null; then
            if [ -n &quot;$data&quot; ]; then
              count=$(echo &quot;$data&quot; | wc -l)
            else
              count=0
            fi
            # Rows go through stdin, not --argjson, so large tables don&#x27;t hit &quot;Argument list too long&quot;
            printf &#x27;%s&#x27; &quot;$data&quot; | jq -R . | jq -s \
              --argjson count &quot;$count&quot; \
              --arg header &quot;$header&quot; \
              --arg stderr &quot;$err_content&quot; \
              --argjson scope &quot;$SCOPE&quot; \
              --argjson notes &quot;$NOTES&quot; \
              &#x27;{count: $count, header: $header, rows: ., stderr: (if $stderr == &quot;&quot; then null else $stderr end), scope: $scope, notes: $notes}&#x27;
          else
            echo &quot;=== STDERR ===&quot;
            echo &quot;$err_content&quot;
            echo &quot;=== HEADER ===&quot;
            echo &quot;$header&quot;
            echo &quot;=== ROWS ===&quot;
            echo &quot;$data&quot;
            echo &quot;=== COUNT ===&quot;
            if [ -n &quot;$data&quot; ]; then echo &quot;$data&quot; | wc -l; else echo 0; fi
          fi
        transformers:
          - name: llm_summarize
            config:
              input_threshold: 10000
              prompt: |
                Summarize this tabular output focusing on:
                - Key patterns and trends in the data
                - Resources that need attention (errors, pending, failures)
                - Group similar items into aggregate descriptions
                - Highlight outliers or unusual values
                - Mention specific resource names only for problematic items
                - Provide counts and distributions where relevant
                - Be concise: aim for ≤ 50% of the original size
                - Keep output actionable and focused on anomalies</code></pre></details><details class="tool-definition"><summary>kubernetes_count</summary><dl class="tool-info"><dt>Toolset</dt><dd>kubernetes/core</dd><dt>Execution</dt><dd>YAMLTool script → paginated kubectl reads → local jq count</dd><dt>Returns</dt><dd>Match count, preview, scope and errors</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L419-L641" target="_blank" rel="noopener noreferrer">kubernetes_count</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L419-L641</small></p><pre><code>      - name: &quot;kubernetes_count&quot;
        user_description: &quot;count: kubectl get {{kind}} | jq &#x27;{{jq_expr}}&#x27; (namespace={{namespace if namespace is string}}, label_selector={{label_selector}}, field_selector={{field_selector}})&quot;
        description: &gt;
          Use kubectl to apply a jq filter and then count the results.
          Use this whenever asked to count kubernetes resources.
          Prefer over bash for large queries - paginates via the Kubernetes API so large
          clusters don&#x27;t overflow context.
          If you know the namespace or labels of the resources you need, pass namespace,
          label_selector and/or field_selector so filtering happens server-side; unscoped
          queries can be slow on large clusters.
          Returns a JSON object with keys: &quot;total_items_processed&quot;, &quot;matches_found&quot; (number of matches),
          &quot;preview&quot; (first 10 results truncated to 200 chars), &quot;stderr&quot; (error output or null),
          &quot;scope&quot; (the resource, namespace and selectors actually queried), and
          &quot;notes&quot; (e.g. a namespace ignored for a cluster-scoped kind).
          The &#x27;kind&#x27; parameter must be the plural form of the resource type (&quot;pods&quot; not &quot;pod&quot;).
          Use select() to filter objects before extracting properties; do not worry about escaping
          the jq_expr - it will be done by the system.
          e.g. .items[] | select(.spec.containers[].image | test(&quot;^gcr.io/&quot;) | not) | .metadata.name
        parameters:
          namespace:
            type: string
            required: false
            description: &quot;Only count resources in this namespace. Ignored for cluster-scoped kinds such as nodes.&quot;
          label_selector:
            type: string
            required: false
            description: &quot;Kubernetes label selector applied server-side, e.g. &#x27;app=web,tier!=db&#x27; or &#x27;env in (prod,staging)&#x27;.&quot;
          field_selector:
            type: string
            required: false
            description: &quot;Kubernetes field selector applied server-side. All kinds support metadata.name and metadata.namespace; pods also support status.phase and spec.nodeName, e.g. &#x27;status.phase!=Running&#x27;.&quot;
        script: |
          #!/bin/bash

          # SECURITY: assign sanitized params to shell variables (unquoted slot),
          # then reference them only as &quot;$VAR&quot; - never interpolate {{ param }}
          # inside a quoted context. See kubernetes_jq_query for the rationale.
          KIND={{ kind }}
          # &#x27;namespace&#x27; is also a Jinja global (namespace()), so it is defined even when omitted
          SEL_NAMESPACE={{ namespace if namespace is string else &quot;&quot; }}
          SEL_LABELS={{ label_selector }}
          SEL_FIELDS={{ field_selector }}
          # Strict tool calls send null for unset optional params, which renders as &#x27;None&#x27;
          [ &quot;$SEL_NAMESPACE&quot; = &quot;None&quot; ] &amp;&amp; SEL_NAMESPACE=&quot;&quot;
          [ &quot;$SEL_LABELS&quot; = &quot;None&quot; ] &amp;&amp; SEL_LABELS=&quot;&quot;
          [ &quot;$SEL_FIELDS&quot; = &quot;None&quot; ] &amp;&amp; SEL_FIELDS=&quot;&quot;

          err_file=$(mktemp)
          TOTAL_PROCESSED=0
          NOTES=&#x27;[]&#x27;
          SCOPE=&#x27;null&#x27;

          add_note() {
            NOTES=$(jq -c --arg note &quot;$1&quot; &#x27;. + [$note]&#x27; &lt;&lt;&lt; &quot;$NOTES&quot;)
          }

          uri_encode() {
            jq -rn --arg v &quot;$1&quot; &#x27;$v|@uri&#x27;
          }

          fail() {
            err_content=$(cat &quot;$err_file&quot; 2&gt;/dev/null)
            rm -f &quot;$err_file&quot;
            jq -n --arg stderr &quot;$1 $err_content&quot; --argjson total &quot;$TOTAL_PROCESSED&quot; --argjson notes &quot;$NOTES&quot; --argjson scope &quot;$SCOPE&quot; \
              &#x27;{total_items_processed: $total, matches_found: 0, preview: [], stderr: $stderr, scope: $scope, notes: $notes}&#x27;
            exit 0
          }

          # The namespace becomes part of the raw API path; see kubernetes_jq_query
          if [ -n &quot;$SEL_NAMESPACE&quot; ] &amp;&amp; ! [[ &quot;$SEL_NAMESPACE&quot; =~ ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$ ]]; then
            fail &quot;Invalid namespace &#x27;${SEL_NAMESPACE}&#x27;: must be a Kubernetes namespace name (lowercase letters, digits and &#x27;-&#x27;).&quot;
          fi

          # Get the API path for the resource kind
          # Match the resource name (first column) as an EXACT string, not a
          # grep regex - otherwise a kind like &#x27;.*&#x27; or &#x27;a|b&#x27; would match the
          # wrong resource.
          CANDIDATES=$(kubectl api-resources --no-headers 2&gt;&gt;&quot;$err_file&quot; | awk -v kind=&quot;$KIND&quot; &#x27;$1 == kind&#x27;)
          API_INFO=$(printf &#x27;%s\n&#x27; &quot;$CANDIDATES&quot; | head -1)
          # Pick the group `kubectl get` picks when several serve this plural.
          # See kubernetes_jq_query for why the first api-resources match is wrong.
          if [ &quot;$(printf &#x27;%s\n&#x27; &quot;$CANDIDATES&quot; | grep -c .)&quot; -gt 1 ] &amp;&amp; [[ &quot;$API_INFO&quot; != *&quot; v1 &quot;* ]]; then
            API_GROUPS=$(kubectl get --raw /apis 2&gt;/dev/null | jq -r &#x27;.groups[].name&#x27; 2&gt;/dev/null)
            if [ -z &quot;$API_GROUPS&quot; ]; then
              add_note &quot;Several API groups serve &#x27;${KIND}&#x27; and server discovery (/apis) failed, so the first group listed by kubectl api-resources was used.&quot;
            fi
            for group in $API_GROUPS; do
              match=$(printf &#x27;%s\n&#x27; &quot;$CANDIDATES&quot; | grep -F &quot; $group/&quot; | head -1)
              if [ -n &quot;$match&quot; ]; then
                API_INFO=&quot;$match&quot;
                break
              fi
            done
          fi

          if [ -z &quot;$API_INFO&quot; ]; then
            fail &quot;Unable to find resource kind &#x27;${KIND}&#x27;.&quot;
          fi

          if [[ &quot;$API_INFO&quot; == *&quot; true &quot;* ]]; then
            NAMESPACED=true
            PREFIX=$(echo &quot;$API_INFO&quot; | sed &#x27;s/ true .*//&#x27;)
          elif [[ &quot;$API_INFO&quot; == *&quot; false &quot;* ]]; then
            NAMESPACED=false
            PREFIX=$(echo &quot;$API_INFO&quot; | sed &#x27;s/ false .*//&#x27;)
          else
            fail &quot;Could not parse API info for &#x27;${KIND}&#x27;.&quot;
          fi

          PREFIX=$(echo &quot;$PREFIX&quot; | sed &#x27;s/  *$//&#x27; | sed &#x27;s/  */ /g&#x27;)

          IFS=&#x27; &#x27; read -ra PREFIX_FIELDS &lt;&lt;&lt; &quot;$PREFIX&quot;
          FIELD_COUNT=0
          for field in &quot;${PREFIX_FIELDS[@]}&quot;; do
            ((FIELD_COUNT++))
          done
          RESOURCE_NAME=&quot;${PREFIX_FIELDS[0]}&quot;

          if [ $FIELD_COUNT -ge 2 ]; then
            API_VERSION=&quot;${PREFIX_FIELDS[$((FIELD_COUNT - 1))]}&quot;
          else
            API_VERSION=&quot;&quot;
          fi

          if [ -z &quot;$API_VERSION&quot; ] || [ -z &quot;$RESOURCE_NAME&quot; ]; then
            fail &quot;Unable to parse API info for resource kind &#x27;${KIND}&#x27;.&quot;
          fi

          # Build API path: namespaced kinds can be listed within one namespace;
          # cluster-scoped kinds ignore the namespace (as kubectl does)
          if [[ &quot;$API_VERSION&quot; == &quot;v1&quot; ]]; then
            API_BASE=&quot;/api/v1&quot;
          else
            API_BASE=&quot;/apis/${API_VERSION}&quot;
          fi
          if [ -n &quot;$SEL_NAMESPACE&quot; ] &amp;&amp; [ &quot;$NAMESPACED&quot; = &quot;true&quot; ]; then
            API_PATH=&quot;${API_BASE}/namespaces/${SEL_NAMESPACE}/${RESOURCE_NAME}&quot;
          else
            if [ -n &quot;$SEL_NAMESPACE&quot; ]; then
              add_note &quot;namespace &#x27;${SEL_NAMESPACE}&#x27; ignored: ${RESOURCE_NAME} is cluster-scoped.&quot;
              SEL_NAMESPACE=&quot;&quot;
            fi
            API_PATH=&quot;${API_BASE}/${RESOURCE_NAME}&quot;
          fi

          SELECTOR_QUERY=&quot;&quot;
          if [ -n &quot;$SEL_LABELS&quot; ]; then
            SELECTOR_QUERY=&quot;${SELECTOR_QUERY}&amp;labelSelector=$(uri_encode &quot;$SEL_LABELS&quot;)&quot;
          fi
          if [ -n &quot;$SEL_FIELDS&quot; ]; then
            SELECTOR_QUERY=&quot;${SELECTOR_QUERY}&amp;fieldSelector=$(uri_encode &quot;$SEL_FIELDS&quot;)&quot;
          fi

          SCOPE=$(jq -nc --arg resource &quot;$RESOURCE_NAME&quot; --arg api_version &quot;$API_VERSION&quot; \
            --arg namespace &quot;$SEL_NAMESPACE&quot; --arg labels &quot;$SEL_LABELS&quot; --arg fields &quot;$SEL_FIELDS&quot; \
            &#x27;{resource: $resource, api_version: $api_version,
              namespace: (if $namespace == &quot;&quot; then null else $namespace end),
              label_selector: (if $labels == &quot;&quot; then null else $labels end),
              field_selector: (if $fields == &quot;&quot; then null else $fields end)}&#x27;)

          # Process resources in chunks using API pagination
          LIMIT=500
          CONTINUE=&quot;&quot;
          ALL_MATCHES=&quot;&quot;

          while true; do
            QUERY=&quot;${API_PATH}?limit=${LIMIT}${SELECTOR_QUERY}&quot;
            if [ -n &quot;$CONTINUE&quot; ]; then
              # continue tokens are base64 and may contain &#x27;+&#x27;, &#x27;/&#x27; or &#x27;=&#x27;
              QUERY=&quot;${QUERY}&amp;continue=$(uri_encode &quot;$CONTINUE&quot;)&quot;
            fi

            OUTPUT=$(kubectl get --raw &quot;$QUERY&quot; 2&gt;&gt;&quot;$err_file&quot;)
            exit_code=$?

            if [ $exit_code -ne 0 ]; then
              fail &quot;kubectl get --raw failed for $QUERY.&quot;
            fi

            ITEMS_COUNT=$(echo &quot;$OUTPUT&quot; | jq &#x27;.items | length&#x27;)
            TOTAL_PROCESSED=$((TOTAL_PROCESSED + ITEMS_COUNT))

            BATCH_MATCHES=$(echo &quot;$OUTPUT&quot; | jq -c -r {{ jq_expr }} 2&gt;&gt;&quot;$err_file&quot;)
            jq_exit=$?
            if [ $jq_exit -ne 0 ]; then
              fail &quot;jq expression failed.&quot;
            fi

            if [ -n &quot;$BATCH_MATCHES&quot; ]; then
              if [ -z &quot;$ALL_MATCHES&quot; ]; then
                ALL_MATCHES=&quot;$BATCH_MATCHES&quot;
              else
                ALL_MATCHES=&quot;$ALL_MATCHES&quot;$&#x27;\n&#x27;&quot;$BATCH_MATCHES&quot;
              fi
            fi

            CONTINUE=$(echo &quot;$OUTPUT&quot; | jq -r &#x27;.metadata.continue // empty&#x27;)
            if [ -z &quot;$CONTINUE&quot; ]; then
              break
            fi
          done

          err_content=$(cat &quot;$err_file&quot; 2&gt;/dev/null)
          rm -f &quot;$err_file&quot;

          # Count and preview the collected matches
          filtered_matches=$(echo &quot;$ALL_MATCHES&quot; | grep -v &#x27;^$&#x27; | grep -v &#x27;^null$&#x27;)
          if [ -z &quot;$filtered_matches&quot; ]; then
            MATCHES_FOUND=0
            PREVIEW=&quot;[]&quot;
          else
            MATCHES_FOUND=$(echo &quot;$filtered_matches&quot; | wc -l)
            PREVIEW=$(echo &quot;$filtered_matches&quot; | head -n 10 | cut -c 1-200 | jq -R . | jq -s &#x27;.&#x27;)
          fi

          jq -n \
            --argjson matches_found &quot;$MATCHES_FOUND&quot; \
            --argjson preview &quot;$PREVIEW&quot; \
            --argjson total_items_processed &quot;$TOTAL_PROCESSED&quot; \
            --arg stderr &quot;$err_content&quot; \
            --argjson scope &quot;$SCOPE&quot; \
            --argjson notes &quot;$NOTES&quot; \
            &#x27;{total_items_processed: $total_items_processed, matches_found: $matches_found, preview: $preview, stderr: (if $stderr == &quot;&quot; then null else $stderr end), scope: $scope, notes: $notes}&#x27;</code></pre></details><details class="tool-definition"><summary>kubectl_top_pods</summary><dl class="tool-info"><dt>Toolset</dt><dd>kubernetes/live-metrics</dd><dt>Execution</dt><dd>YAMLTool command → kubectl top pods -A → Kubernetes Metrics API</dd><dt>Returns</dt><dd>Current pod CPU/memory usage</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L673-L676" target="_blank" rel="noopener noreferrer">kubectl_top_pods</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L673-L676</small></p><pre><code>      - name: &quot;kubectl_top_pods&quot;

pt: holmes/core/transformers/llm_summarize.py:L99-L128</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/transformers/llm_summarize.py#L130-L173" target="_blank" rel="noopener noreferrer">LLMSummarizeTransformer.transform</a><small class="source-path">holmesgpt: holmes/core/transformers/llm_summarize.py:L130-L173</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/core/tools.py#L385-L390" target="_blank" rel="noopener noreferrer">Tool.get_openai_format</a><small class="source-path">holmesgpt: holmes/core/tools.py:L385-L390</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L419-L641" target="_blank" rel="noopener noreferrer">kubernetes_count</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L419-L641</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L673-L676" target="_blank" rel="noopener noreferrer">kubectl_top_pods</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L673-L676</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes.yaml#L677-L680" target="_blank" rel="noopener noreferrer">kubectl_top_nodes</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes.yaml:L677-L680</small></li></ul></div></template>
<template id="detail-bash" data-title="RunBashCommand"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Run an allowed shell command.</p><dl><dt>Input</dt><dd><ul><li>bash: command text, suggested command prefixes and an optional timeout.</li></ul></dd><dt>Output</dt><dd><ul><li>Command output, exit status or error.</li><li>Rejection if the command is not allowed.</li></ul></dd><dt>Behavior</dt><dd><ul><li>Check the command against stage-specific allow and deny rules.</li><li>Reject commands that need approval because this deployment has no interactive approval callback.</li><li>Execute allowed commands in a Bash subprocess. Commands using kubectl follow the Kubernetes access proxy.</li><li>Run local pipeline steps, such as jq, inside the agent.</li><li>Run the command in a shell process group. At the timeout, terminate the group and finish collecting output within a bounded interval.</li></ul></dd></dl><h3>Tool definitions</h3><details class="tool-definition"><summary>bash</summary><dl class="tool-info"><dt>Toolset</dt><dd>bash</dd><dt>Execution</dt><dd>RunBashCommand → permission checks → Bash; kubectl uses the Kubernetes access proxy</dd><dt>Returns</dt><dd>Command output/status or rejection/timeout information</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/bash/bash_toolset.py#L104-L143" target="_blank" rel="noopener noreferrer">RunBashCommand.__init__</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/bash/bash_toolset.py:L104-L143</small></p><pre><code>    def __init__(self, toolset: &quot;BashExecutorToolset&quot;):
        super().__init__(
            name=&quot;bash&quot;,
            description=(
                &quot;Executes a bash command and returns its output. &quot;
                &quot;Supports: single commands, pipes (|), &amp;&amp;, ||, ;, &amp;. &quot;
                &quot;Also supports (requires user approval): for/while/until loops, if/case statements, &quot;
                &quot;subshells $() and backticks. &quot;
                &quot;You must provide suggested_prefixes - one prefix per command segment. &quot;
                &quot;Example: for &#x27;kubectl get pods | grep error&#x27;, provide &quot;
                &quot;suggested_prefixes=[&#x27;kubectl get&#x27;, &#x27;grep&#x27;]. &quot;
                &quot;For scripts with loops/conditionals, provide prefixes for the key operations inside.&quot;
            ),
            parameters={
                &quot;command&quot;: ToolParameter(
                    description=&quot;The bash command string to execute.&quot;,
                    type=&quot;string&quot;,
                    required=True,
                ),
                &quot;suggested_prefixes&quot;: ToolParameter(
                    description=(
                        &quot;Array of command prefixes, one per command segment. &quot;
                        &quot;Include command name and subcommand (e.g., &#x27;kubectl get&#x27;, &#x27;grep&#x27;). &quot;
                        &quot;Do NOT include resource names, namespaces, or flag values.&quot;
                    ),
                    type=&quot;array&quot;,
                    items=ToolParameter(type=&quot;string&quot;),
                    required=True,
                ),
                &quot;timeout&quot;: ToolParameter(
                    description=(
                        &quot;Optional timeout in seconds for the command execution. &quot;
                        &quot;Defaults to 30s.&quot;
                    ),
                    type=&quot;integer&quot;,
                    required=False,
                ),
            },
            toolset=toolset,  # type: ignore[call-arg]
        )</code></pre></details><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/bash/bash_toolset.py#L104-L143" target="_blank" rel="noopener noreferrer">RunBashCommand.__init__</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/bash/bash_toolset.py:L104-L143</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/bash/bash_toolset.py#L145-L162" target="_blank" rel="noopener noreferrer">RunBashCommand._validate_command</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/bash/bash_toolset.py:L145-L162</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/bash/bash_toolset.py#L164-L197" target="_blank" rel="noopener noreferrer">RunBashCommand.requires_approval</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/bash/bash_toolset.py:L164-L197</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/bash/bash_toolset.py#L199-L271" target="_blank" rel="noopener noreferrer">RunBashCommand._invoke</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/bash/bash_toolset.py:L199-L271</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/bash/common/bash.py#L15-L74" target="_blank" rel="noopener noreferrer">run_bash: shell execution and timeout</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/bash/common/bash.py:L15-L74</small></li><li><a href="../../../patches/holmesgpt/shell-timeout.patch" target="_blank" rel="noopener noreferrer">Shell timeout handling</a><small class="source-path">parent: patches/holmesgpt/shell-timeout.patch</small></li></ul></div></template>
<template id="detail-logs" data-title="Python Tool classes"><div class="detail-body"><p class="owner">HOLMESGPT</p><p>Run log, network, task, skill and image tools.</p><dl><dt>Input</dt><dd><ul><li>fetch_pod_logs: pod, namespace, time range, text filters and output limit.</li><li>fetch_webpage: URL. tcp_check: host, port and optional timeout.</li><li>TodoWrite: complete task list with IDs, descriptions and statuses.</li><li>fetch_skill: skill ID or name. read_image_file: image path in HolmesGPT’s result-storage directory.</li></ul></dd><dt>Output</dt><dd><ul><li>Filtered pod logs, page text/Markdown or TCP connection results.</li><li>Formatted task lists, skill instructions, images and file information.</li><li>Failure or refusal information when a request cannot run.</li></ul></dd><dt>Behavior</dt><dd><ul><li>PodLoggingTool delegates to KubernetesLogsToolset: retrieve current/previous container logs with parallel kubectl processes, then combine, filter and limit them locally.</li><li>FetchWebpage validates each URL and redirect, performs HTTP GET requests and converts HTML to Markdown.</li><li>TcpCheckTool checks the destination and probe budget, then opens a Python socket connection if allowed.</li><li>TodoWriteTool formats the supplied tasks and returns them to the conversation. It records the plan; other tool calls perform the work.</li><li>SkillsFetcher reads the requested skill from the configured catalog and returns its instructions. Remote skill lookup requires a configured data-access layer.</li><li>ReadImageFile reads an allowed image from HolmesGPT’s result-storage directory and returns image data for a vision-capable model.</li><li>Local processing runs inside the agent container. SDK destination rules and SREGym’s network policy determine which network requests can leave it.</li></ul></dd></dl><h3>Tool definitions</h3><details class="tool-definition"><summary>fetch_pod_logs</summary><dl class="tool-info"><dt>Toolset</dt><dd>kubernetes/logs</dd><dt>Execution</dt><dd>PodLoggingTool → KubernetesLogsToolset → parallel kubectl logs → local filtering</dd><dt>Returns</dt><dd>Filtered container log text and errors</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/logging_utils/logging_api.py#L21-L28" target="_blank" rel="noopener noreferrer">Log defaults and tool name</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/logging_utils/logging_api.py:L21-L28</small></p><pre><code># Default values for log fetching
DEFAULT_LOG_LIMIT = 100
SECONDS_PER_DAY = 24 * 60 * 60
DEFAULT_TIME_SPAN_SECONDS = 7 * SECONDS_PER_DAY  # 1 week in seconds
DEFAULT_GRAPH_TIME_SPAN_SECONDS = 1 * 60 * 60  # 1 hour in seconds

POD_LOGGING_TOOL_NAME = &quot;fetch_pod_logs&quot;
</code></pre><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/logging_utils/logging_api.py#L127-L176" target="_blank" rel="noopener noreferrer">PodLoggingTool.__init__</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/logging_utils/logging_api.py:L127-L176</small></p><pre><code>    def __init__(self, toolset: &quot;KubernetesLogsToolset&quot;):
        toolset_name = toolset.name if toolset.name else &quot;logging backend&quot;
        description = (
            f&quot;Fetch logs for a Kubernetes pod from {toolset_name}&quot;
            &quot; with support for regex filtering and exclusion patterns&quot;
            f&quot;. Defaults: Fetches last {DEFAULT_TIME_SPAN_SECONDS // SECONDS_PER_DAY} days of logs, limited to {DEFAULT_LOG_LIMIT} most recent entries&quot;
        )

        parameters = {
            &quot;pod_name&quot;: ToolParameter(
                description=&quot;The exact kubernetes pod name&quot;,
                type=&quot;string&quot;,
                required=True,
            ),
            &quot;namespace&quot;: ToolParameter(
                description=&quot;Kubernetes namespace&quot;, type=&quot;string&quot;, required=True
            ),
            &quot;start_time&quot;: ToolParameter(
                description=f&quot;RFC3339 datetime (e.g. &#x27;2023-03-01T10:30:00Z&#x27;) or negative number as string for seconds before end_time (e.g. &#x27;-3600&#x27;). Default: -{DEFAULT_TIME_SPAN_SECONDS} (last {DEFAULT_TIME_SPAN_SECONDS // SECONDS_PER_DAY} days)&quot;,
                type=&quot;string&quot;,
                required=False,
            ),
            &quot;end_time&quot;: ToolParameter(
                description=&quot;RFC3339 datetime (e.g. &#x27;2023-03-01T12:30:00Z&#x27;). Default: now.&quot;,
                type=&quot;string&quot;,
                required=False,
            ),
            &quot;limit&quot;: ToolParameter(
                description=f&quot;Maximum number of logs to return. Default: {DEFAULT_LOG_LIMIT}&quot;,
                type=&quot;integer&quot;,
                required=False,
            ),
            &quot;filter&quot;: ToolParameter(
                description=&quot;Optional keyword/phrase or case-insensitive regex to match, e.g. filter=&#x27;err|error|fatal|fail|exception|panic&#x27; for errors. If no results, broaden the pattern or drop the filter.&quot;,
                type=&quot;string&quot;,
                required=False,
            ),
            &quot;exclude_filter&quot;: ToolParameter(
                description=&quot;Optional keyword or case-insensitive regex to exclude, e.g. exclude_filter=&#x27;health|metrics|ping&#x27; to cut noise when hitting the log limit.&quot;,
                type=&quot;string&quot;,
                required=False,
            ),
        }

        super().__init__(
            name=POD_LOGGING_TOOL_NAME,
            description=description,
            parameters=parameters,
        )
        self._toolset = toolset</code></pre></details><details class="tool-definition"><summary>TodoWrite</summary><dl class="tool-info"><dt>Toolset</dt><dd>core_investigation</dd><dt>Execution</dt><dd>TodoWriteTool → format the supplied task list in the agent conversation</dd><dt>Returns</dt><dd>Task descriptions and statuses</dd></dl><p><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/investigator/core_investigation.py#L20-L59" target="_blank" rel="noopener noreferrer">TodoWriteTool: name and parameters</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/investigator/core_investigation.py:L20-L59</small></p><pre><code>TODO_WRITE_TOOL_NAME = &quot;TodoWrite&quot;


def parse_tasks(todos_data: Any) -&gt; list[Task]:
    tasks = []

    for todo_item in todos_data:
        if isinstance(todo_item, dict):
            task = Task(
                id=todo_item.get(&quot;id&quot;, str(uuid4())),
                content=todo_item.get(&quot;content&quot;, &quot;&quot;),
                status=TaskStatus(todo_item.get(&quot;status&quot;, &quot;pending&quot;)),
            )
            tasks.append(task)

    return tasks


class TodoWriteTool(Tool):
    name: str = TODO_WRITE_TOOL_NAME
    description: str = &quot;Save investigation tasks to break down complex problems into manageable sub-tasks. ALWAYS provide the COMPLETE list of all tasks, not just the ones being updated.&quot;
    parameters: Dict[str, ToolParameter] = {
        &quot;todos&quot;: ToolParameter(
            description=&quot;COMPLETE list of ALL tasks on the task list. Each task should have: id (string), content (string), status (pending/in_progress/completed/failed)&quot;,
            type=&quot;array&quot;,
            required=True,
            items=ToolParameter(

            &quot; section of your instructions -- that catalog is built per request and is the&quot;
            &quot; authoritative list, including the current user&#x27;s personal skills.&quot;

        self._search_paths = search_paths</code></pre></details><h3>Related Sources</h3><ul class="sources"><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/logging_utils/logging_api.py#L127-L176" target="_blank" rel="noopener noreferrer">PodLoggingTool.__init__</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/logging_utils/logging_api.py:L127-L176</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/logging_utils/logging_api.py#L178-L202" target="_blank" rel="noopener noreferrer">PodLoggingTool._invoke</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/logging_utils/logging_api.py:L178-L202</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes_logs.py#L51-L67" target="_blank" rel="noopener noreferrer">KubernetesLogsToolset.__init__</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes_logs.py:L51-L67</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes_logs.py#L89-L219" target="_blank" rel="noopener noreferrer">KubernetesLogsToolset.fetch_pod_logs</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes_logs.py:L89-L219</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes_logs.py#L221-L296" target="_blank" rel="noopener noreferrer">KubernetesLogsToolset._fetch_kubectl_logs</a><small class="source-path">holmesgpt: holmes/plugins/toolsets/kubernetes_logs.py:L221-L296</small></li><li><a href="https://github.com/HolmesGPT/holmesgpt/blob/21ca948b8b4935a2ed0aa98dae05449d10953005/holmes/plugins/toolsets/kubernetes_logs.py#L677-L786" target="_blank" rel="noopener noreferrer">filter_
